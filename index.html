<!doctype html>
<html lang="es">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Lennaax — mis links</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dyewoctfu/image/upload/e_background_removal/avatar-face.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#090909;--pink:#ff4fa3;--muted:#a7a2a6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px;background:#090909;color:#fff;font-family:'DM Sans',sans-serif;overflow-x:hidden;position:relative}
    main{width:min(100%,440px);flex:0 1 440px;text-align:center;position:relative;z-index:3;margin:auto}
    .spark{height:38px;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}.spark img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 5px #0008)}.spark img.grass{width:38px;height:34px}
    .avatar{width:100px;height:100px;margin:0 auto 22px;border-radius:50%;display:block;object-fit:cover;box-shadow:0 0 0 7px #ff4fa31a,0 10px 42px #ff4fa333;border:3px solid #ffffffaa}
    h1{font:700 clamp(34px,9vw,44px) 'Space Grotesk',sans-serif;letter-spacing:-2px;margin:0}
    .handle{margin:5px 0 12px;color:var(--pink);font-weight:600;font-size:14px}
    .bio{color:#c4bec2;font-size:14px;line-height:1.6;margin:0 auto 30px;max-width:310px}
    .links{display:grid;gap:12px}
    .link{min-height:64px;padding:0 18px;display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:#fff;background:#171517;border:1px solid #ffffff16;border-radius:17px;transition:transform .18s,border-color .18s,background .18s}
    .link:hover{transform:translateY(-3px);border-color:#ff4fa37a;background:#21171e}
    .icon{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:12px;background:#ffffff0d;color:var(--pink)}
    .icon svg{width:20px;height:20px;fill:currentColor}
    .label{font-weight:700;font-size:15px}
    .sub{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:400}
    .arrow{margin-left:auto;color:#8c858a;font-size:20px}
    .video-bg{position:fixed;z-index:1;top:50%;left:50%;width:120vw;height:120vh;transform:translate(-50%,-50%);border:0;pointer-events:none;filter:blur(4px) brightness(.58) saturate(.9);object-fit:cover;opacity:1}.video-shade{position:fixed;z-index:2;inset:0;pointer-events:none;background:linear-gradient(180deg,#08070bb0,#10080c88 45%,#08070bd9)}footer{margin-top:28px;color:#777078;font-size:11px;letter-spacing:2px;text-transform:uppercase}footer a{color:var(--pink);text-decoration:none}footer a:hover{color:#ff8bc1}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <video class="video-bg" autoplay muted loop playsinline aria-hidden="true"><source src="https://res.cloudinary.com/dyewoctfu/video/upload/v1795031524/videoplayback_1.mp4" type="video/mp4"></video>
  <div class="video-shade" aria-hidden="true"></div>
  <main>

    <img class="avatar" src="https://res.cloudinary.com/dyewoctfu/image/upload/f_auto/q_auto/6738149c-812b-4df4-9f78-4804a7fdfb94-fullsize.webp" alt="Foto de perfil de Lennaax">
