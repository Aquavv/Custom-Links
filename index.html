<script>
const bg = document.querySelector(".video-bg");
if (bg) {
  let frame;
  window.addEventListener("pointermove", event => {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const x = ((event.clientX / window.innerWidth) - .5) * 8;
      const y = ((event.clientY / window.innerHeight) - .5) * 6;
      bg.style.transform = "translate(calc(-50% + " + x.toFixed(1) + "px),calc(-50% + " + y.toFixed(1) + "px)) scale(1.005)";
    });
  }, { passive: true });
}
</script>
<script>
(() => {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const colors = ["#e4f75a", "#d7ed37", "#c9e52f", "#bce02b", "#aeda27", "#a0d325", "#92cc23", "#84c321", "#76b91f", "#69ad1e", "#5da01c", "#528f1b"];
  const dots = colors.map((color, i) => {
    const dot = document.createElement("i");
    dot.className = "xp-cursor-dot";
    const size = Math.max(4, 13 - i * 0.72);
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.setProperty("--xp-color", color);
    dot.style.opacity = "0";
    document.body.appendChild(dot);
    return { el: dot, x: 0, y: 0 };
  });
  let targetX = 0, targetY = 0, started = false, raf = 0;
  const animate = () => {
    let x = targetX, y = targetY;
    dots.forEach((dot, i) => {
      const follow = i === 0 ? 0.42 : 0.30;
      dot.x += (x - dot.x) * follow;
      dot.y += (y - dot.y) * follow;
      dot.el.style.left = dot.x + "px";
      dot.el.style.top = dot.y + "px";
      dot.el.style.opacity = String(Math.max(0.18, 1 - i * 0.055));
      x = dot.x;
      y = dot.y;
    });
    raf = requestAnimationFrame(animate);
  };
  window.addEventListener("pointermove", event => {
    targetX = event.clientX;
    targetY = event.clientY;
    if (!started) {
      dots.forEach(dot => { dot.x = targetX; dot.y = targetY; });
      started = true;
      document.body.classList.add("xp-cursor-on");
      raf = requestAnimationFrame(animate);
    }
  }, { passive: true });
  window.addEventListener("pointerleave", () => {
    document.body.classList.remove("xp-cursor-on");
    dots.forEach(dot => { dot.el.style.opacity = "0"; });
    started = false;
    cancelAnimationFrame(raf);
  });
})();
</script>
